name: Feature proposal
description: Describe the user problem and desired outcome.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Accessibility, privacy and language considerations
